<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="drag" data-tauri-drag-region></div>
    <button class="side-btn" id="search-btn" title="Search (⌘K)">Search <kbd>⌘K</kbd></button>
    <button class="side-btn" id="new-note-btn" title="New page (⌘N)">New page <kbd>⌘N</kbd></button>
    <button class="side-btn" id="new-folder-btn" title="New folder (⇧⌘N)">New folder <kbd>⇧⌘N</kbd></button>
    <button class="side-btn" id="new-sketch-btn" title="New sketch (⌥⌘N)">New sketch <kbd>⌥⌘N</kbd></button>
    <button class="side-btn" id="settings-btn" title="Settings (⌘,)">Settings <kbd>⌘,</kbd></button>
    <div id="tree" role="tree"></div>
    <div id="root-path" title="Notes folder. Click to copy the path for AI agents."></div>
  </aside>
  <main id="main">
    <div class="drag top-drag" data-tauri-drag-region></div>
    <div id="page" hidden>
      <div id="crumbs"></div>
      <h1 id="title" contenteditable="plaintext-only" spellcheck="false" data-placeholder="Untitled"></h1>
      <div id="editor"></div>
    </div>
    <div id="empty">
      <p>No page open.</p>
      <p><kbd>⌘N</kbd> new page &nbsp; <kbd>⌘K</kbd> search</p>
    </div>
    <div id="sketch" hidden></div>
  </main>

  <div id="slash" class="popup" hidden></div>
  <div id="ctx" class="popup" hidden></div>
  <div id="palette" hidden>
    <div class="palette-box">
      <input id="palette-input" placeholder="Search pages…" autocomplete="off" spellcheck="false">
      <div id="palette-results"></div>
    </div>
  </div>
  <div id="settings" hidden>
    <div class="palette-box" role="dialog" aria-label="Settings">
      <h2>Settings</h2>
      <div class="setting"><span>Appearance</span>
        <div class="seg" id="theme-seg">
          <button data-theme="system">System</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
        </div>
      </div>
      <label class="setting"><span>Menu font</span><input id="set-ui-font" list="font-list" spellcheck="false"></label>
      <label class="setting"><span>Page font</span><input id="set-page-font" list="font-list" spellcheck="false"></label>
      <label class="setting"><span>Code font</span><input id="set-code-font" list="font-list" spellcheck="false"></label>
      <label class="setting"><span>Page text size</span>
        <select id="set-page-size">
          <option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option>
          <option value="18">18</option><option value="20">20</option><option value="22">22</option>
        </select>
      </label>
      <div class="setting-note">Pick from the list or type the name of any font installed on your Mac. Fonts only change how notes look, the .md files stay the same.</div>
      <datalist id="font-list"></datalist>
      <datalist id="lang-list"></datalist>
    </div>
  </div>
  <div id="toast" hidden></div>

  <script src="vendor/highlight.min.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>

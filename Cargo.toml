[package]
name = "dominote"
version = "0.2.0"
edition = "2021"
description = "A fast, local Markdown note app for macOS"
license = "MIT"
repository = "https://github.com/dominik-hurcik/dominote-mac"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
